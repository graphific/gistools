# Environment for the tools in this repo. From this directory:
#   pixi run chm --bbox W S E N --out DIR
#   pixi run crowns --chm canopy.tif --out DIR
# Another tool gets its own task and a folder under tools/.
[workspace]
name = "tools"
description = "Raster tools. chm writes canopy height. crowns writes tree tops and crowns."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
scipy = "*"
rasterio = "*"
shapely = ">=2.1"
pyogrio = "*"
laspy = "*"
lazrs-python = "*"
pyproj = "*"
matplotlib-base = "*"

[tasks]
chm = { cmd = "python -m tools.chm", description = "Calibrated canopy height at 10 m and 1 m. Arguments follow." }
crowns = { cmd = "python -m tools.crowns", description = "Tree tops, trunks and crowns. Arguments follow." }
